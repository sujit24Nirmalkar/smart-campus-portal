<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <style>
      body {
        /* background-image: ssipmt front2.avif; */
        background-color: #1a1a1a;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        background-color: #fff;
        border-radius: 8px;
        padding: 30px;
        width: 300px;
      }
      .otp {
        display: flex;
        gap: 14px;
        justify-content: center;
        align-items: center;
        flex-wrap: nowrap;
      }
      .otp-input {
        width: clamp(20px, 5vw, 30px);
        height: clamp(48px, 10vh);
        text-align: center;
        font-size: clamp(1rem, 3vw, 1.5rem);
        font-weight: 600;
        color: var(--text);
        background: var(--input-bg);
        border: 2px solid var(--border);
        border-radius: var(--radius);
        outline: none;
        transition: 0.2s ease;
        box-shadow: #939292 0px 8px 10px;
      }
      .otp-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 10px var(--accent);
        transition: scale(1.05);
      }
      .otp-input.filled {
        border-color: var(--accent);
        background: #565555;
      }
      h2 {
        color: #1a50a0;
        text-align: center;
        margin-bottom: 20px;
      }
      form {
        display: flex;
        flex-direction: column;
      }
      input {
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid black;
        background-color: #d8d8d8;
      }
      button {
        background-color: #1b81da;
        color: #fff;
        padding: 10px;
        border-radius: 8px;
      }
      button:hover {
        background-color: #0741ac;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>login</h2>
      <form action="">
        <input type="email" name="" id="" placeholder="Email" />
        <button type="button">OTP</button>
        <div class="otp">
          <input type="text" maxlength="1" class="otp-input" />
          <input type="text" maxlength="1" class="otp-input" />
          <input type="text" maxlength="1" class="otp-input" />
          <input type="text" maxlength="1" class="otp-input" />
        </div>

        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
